<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Css/login.css" />
    <title>Cadastro</title>
  </head>
  <body>
    <main>
      <section class="login-card">
        <h1 id="titulo-cadastro">Cadastro</h1>
        <form id="formCadastro">
          <label for="nome">Nome</label>
          <input type="text" id="nome" required />

          <label for="cpf">CPF</label>
          <input
            type="text"
            id="cpf"
            inputmode="numeric"
            maxlength="11"
            required
          />

          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" autocomplete="tel" required />

          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="email" required />

          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            minlength="6"
            autocomplete="new-password"
            required
          />

          <button type="submit" id="botao-cadastro">Criar conta</button>
        </form>
        <p id="mensagemCadastro" aria-live="polite"></p>

        <p id="login-link">
          Já possui uma conta? <a href="login.html">Entrar</a>
        </p>
      </section>
    </main>
    <script type="module" src="../Js/cadastro.js"></script>
  </body>
</html>
