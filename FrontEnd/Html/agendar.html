<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Css/agendar.css" />
    <link rel="stylesheet" href="Css/header.css" />
    <title>Agendar</title>
  </head>
  <body>
    <header>
      <img src="Imagens/Logo.png" alt="Logo da Barbearia Imperial" id="imagemCentralHeader" />
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="agendar.html" class="ativo">Agendar</a></li>
        <li><a href="sobre.html">Sobre a Barbearia</a></li>
      </ul>
    </header>
    <main>
      <div id="agendamento">
        <img src="Imagens/Logo.png" id="logo-Agendar" />
        <input id="Nome" type="text" placeholder="Nome" />
        <input id="cpf" type="text" placeholder="CPF" />
        <input id="telefone" type="tel" placeholder="Telefone" />
        <input id="email" type="email" placeholder="E-mail" />

        <select id="servico">
          <option value="">Escolha o serviço</option>
        </select>

        <select id="barbeiro">
          <option value="">Escolha o profissional</option>
        </select>

        <input id="data" type="date" />

        <select id="horario">
          <option value="">Escolha o horario</option>
        </select>

        <button id="confirmarAgendamento">Confirmar pagamento</button>

        <p id="mensagem"></p>
      </div>
    </main>
  </body>
</html>
